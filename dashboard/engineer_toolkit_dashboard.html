<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineer's Master Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --bg2: #131619;
    --bg3: #1a1e23;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #eaeaea;
    --text2: #8a9099;
    --text3: #555c66;
    --accent: #00c9a7;
    --accent2: #0098ff;
    --font: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,18,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .logo-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .logo-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    margin-top: 1px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  #search {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 12px 7px 34px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--text3); }
  #search:focus { border-color: var(--accent); }
  .count-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    white-space: nowrap;
  }
  .count-badge span { color: var(--accent); font-weight: 500; }

  /* ── MAIN LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 60px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    background: var(--bg2);
  }
  .sidebar-title {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 8px;
  }
  .filter-group { margin-bottom: 1.5rem; }
  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: var(--bg3); color: var(--text); }
  .filter-btn.active { background: rgba(0,201,167,0.1); color: var(--accent); }
  .filter-btn .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-btn .fcount {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    background: var(--bg3);
    border-radius: 10px;
    padding: 1px 6px;
  }
  .filter-btn.active .fcount { color: var(--accent); }
  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1rem 0;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 1rem;
  }
  .stat-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .stat-num {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
  }
  .stat-lbl {
    font-size: 10px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* ── CONTENT ── */
  .content { padding: 2rem; overflow-y: auto; }

  .section { margin-bottom: 2.5rem; }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .section-icon {
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .section-count {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.1rem 1rem 1.3rem;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  .card:hover {
    border-color: var(--border2);
    background: var(--bg3);
    transform: translateY(-1px);
  }
  .card-bar {
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-icon {
    width: 32px; height: 32px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .cost-pill {
    font-family: var(--mono);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid;
    white-space: nowrap;
  }
  .cost-free { color: #00c9a7; border-color: rgba(0,201,167,0.3); background: rgba(0,201,167,0.08); }
  .cost-freemium { color: #f0a500; border-color: rgba(240,165,0,0.3); background: rgba(240,165,0,0.08); }
  .cost-paid { color: #ff6b6b; border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .card-desc {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.55;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }
  .tag {
    font-family: var(--mono);
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text2);
    background: rgba(255,255,255,0.04);
  }
  .visit-link {
    font-size: 11px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 3px;
    text-decoration: none;
  }
  .card:hover .visit-link { color: var(--accent); }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: none;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
  }
  .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ── HIDDEN ── */
  .hidden { display: none !important; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .topbar { padding: 0 1rem; }
    #search { width: 160px; }
    .content { padding: 1.25rem; }
  }
</style>
</head>

    { n:"Slow Roads", desc:"Relaxing endless procedural driving simulator with scenic natural environments and ambient sound.", url:"https://slowroads.io", tags:["web","simulator","free"], label:"Simulation", cost:"Free", bar:"#22c55e", iconBg:"rgba(34,197,94,0.15)", icon:"🚗" },
    { n:"Zoomquilt ZZZ", desc:"Infinite zoom surreal collaborative art piece and ambient relaxation experience for your browser.", url:"https://zoomquilt.org", tags:["web","free"], label:"Creative", cost:"Free", bar:"#ec4899", iconBg:"rgba(236,72,153,0.15)", icon:"🌀" },
    { n:"CODESYS MC_MoveRelative", desc:"Official CODESYS SM3 Basic motion control documentation for the MC_MoveRelative PLC function block — relative axis movement reference.", url:"https://help.codesys.com", tags:["web","plc","servo","free"], label:"CODESYS Docs", cost:"Free", bar:"#f0a500", iconBg:"rgba(240,165,0,0.15)", icon:"📋" },
    { 
  n:"Learn Anything", 
  desc:"Open-source knowledge graph and learning roadmap explorer. Discover curated learning paths for any topic — programming, engineering, science, and more.", 
  url:"https://learn-anything.xyz/", 
  tags:["web","free"], 
  label:"Knowledge Graph", 
  cost:"Free", 
  bar:"#00c9a7", 
  iconBg:"rgba(0,201,167,0.15)", 
  icon:"🧠" 
},
  ]
};

const COST_CLASS = { Free:'cost-free', Freemium:'cost-freemium', Paid:'cost-paid' };

function buildCard(item) {
  return `
    <a class="card" href="${item.url}" target="_blank" rel="noopener"
       data-tags="${item.tags.join(',')}"
       data-n="${item.n.toLowerCase()}"
       data-d="${item.desc.toLowerCase()}">
      <div class="card-bar" style="background:${item.bar}"></div>
      <div class="card-top">
        <div class="card-icon" style="background:${item.iconBg}">${item.icon}</div>
        <span class="cost-pill ${COST_CLASS[item.cost]}">${item.cost}</span>
      </div>
      <div class="card-name">${item.n}</div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-footer">
        <span class="tag">${item.label}</span>
        <span class="visit-link">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          visit
        </span>
      </div>
    </a>`;
}

// Build all grids
Object.keys(DATA).forEach(sec => {
  document.getElementById('grid-'+sec).innerHTML = DATA[sec].map(buildCard).join('');
});

let activeF = 'all';

function doFilter() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let total = 0;

  Object.keys(DATA).forEach(sec => {
    const cards = document.querySelectorAll(`#grid-${sec} .card`);
    let secVisible = 0;
    cards.forEach(card => {
      const mf = activeF === 'all' || card.dataset.tags.split(',').includes(activeF);
      const ms = !q || card.dataset.n.includes(q) || card.dataset.d.includes(q);
      const show = mf && ms;
      card.classList.toggle('hidden', !show);
      if (show) secVisible++;
    });
    total += secVisible;
    const secEl = document.getElementById('sec-'+sec);
    secEl.style.display = secVisible === 0 ? 'none' : '';
    const scEl = document.getElementById('sc-'+sec);
    if (scEl) scEl.textContent = secVisible + ' resource' + (secVisible !== 1 ? 's' : '');
  });

  document.getElementById('vis-count').textContent = total;
  document.getElementById('empty-state').style.display = total === 0 ? 'flex' : 'none';
}

function setF(f, btn) {
  activeF = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  doFilter();
}
</script>
